<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Absensi Harian</title>
<meta name="description" content="Kelola anggota, sesi absen, dan pengaturan aplikasi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-dot">💗</span>
      <span id="brandName">Absensi</span>
    </a>
    <nav class="nav">
      <a href="index.html">Absen</a>
      <a href="data.html">Data</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <p class="eyebrow">Pengelolaan</p>
    <h1>Admin</h1>
    <p class="sub">Kelola anggota, sesi absen, dan pengaturan aplikasi.</p>
  </section>

  <section class="card narrow" id="gateCard">
    <h2>Masuk Admin</h2>
    <p class="muted small">Masukkan PIN admin. PIN awal: <code>123456</code></p>
    <form id="gateForm" class="row">
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN admin" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Masuk</button>
    </form>
    <p class="msg" id="gateMsg"></p>
  </section>

  <section id="adminBody" class="stack hidden">

    <div class="tabs">
      <button class="tab active" data-tab="member" type="button">Anggota</button>
      <button class="tab" data-tab="sesi" type="button">Sesi</button>
      <button class="tab" data-tab="setting" type="button">Pengaturan</button>
      <button class="tab tab-right" id="logoutBtn" type="button">Keluar</button>
    </div>

    <!-- ===== Anggota ===== -->
    <div class="panel" data-panel="member">
      <div class="grid-2">
        <section class="card">
          <h2 id="memberFormTitle">Tambah Anggota</h2>
          <form id="memberForm" class="stack">
            <input type="hidden" id="memberId">
            <div class="field">
              <label for="memberName">Nama</label>
              <input id="memberName" required placeholder="Nama lengkap">
            </div>
            <div class="field">
              <label for="memberNick">Panggilan</label>
              <input id="memberNick" placeholder="Nama panggilan">
            </div>
            <div class="field">
              <label for="memberEmoji">Emoji</label>
              <input id="memberEmoji" value="💗" maxlength="4">
            </div>
            <div class="row">
              <button class="btn btn-primary" type="submit">Simpan</button>
              <button class="btn btn-ghost" type="button" id="memberReset">Batal</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>Daftar Anggota</h2>
            <span class="muted small" id="memberCount">0</span>
          </div>
          <ul class="list" id="memberList">
            <li class="empty">Belum ada anggota.</li>
          </ul>
        </section>
      </div>
    </div>

    <!-- ===== Sesi ===== -->
    <div class="panel hidden" data-panel="sesi">
      <div class="grid-2">
        <section class="card">
          <h2 id="sessionFormTitle">Tambah Sesi</h2>
          <form id="sessionForm" class="stack">
            <input type="hidden" id="sessionId">
            <div class="field">
              <label for="sessionTitleInput">Judul</label>
              <input id="sessionTitleInput" required placeholder="Absen Harian">
            </div>
            <div class="field">
              <label for="sessionDate">Tanggal</label>
              <input id="sessionDate" type="date" required>
            </div>
            <div class="row">
              <div class="field grow">
                <label for="sessionOpen">Jam buka</label>
                <input id="sessionOpen" type="time" value="06:00" required>
              </div>
              <div class="field grow">
                <label for="sessionClose">Jam tutup</label>
                <input id="sessionClose" type="time" value="21:00" required>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-primary" type="submit">Simpan</button>
              <button class="btn btn-ghost" type="button" id="sessionReset">Batal</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>Daftar Sesi</h2>
            <span class="muted small" id="sessionCount">0</span>
          </div>
          <ul class="list" id="sessionList">
            <li class="empty">Belum ada sesi.</li>
          </ul>
        </section>
      </div>
    </div>

    <!-- ===== Pengaturan ===== -->
    <div class="panel hidden" data-panel="setting">
      <section class="card narrow">
        <h2>Pengaturan Aplikasi</h2>
        <form id="settingForm" class="stack">
          <div class="field">
            <label for="setTitle">Judul aplikasi</label>
            <input id="setTitle" placeholder="Absensi Harian">
          </div>
          <div class="field">
            <label for="setSubtitle">Teks di halaman absen</label>
            <input id="setSubtitle" placeholder="Pilih nama, lalu tandai kehadiranmu.">
          </div>
          <label class="check">
            <input id="setRequireReason" type="checkbox">
            <span>Wajib isi alasan untuk Sakit / Izin / Dispen</span>
          </label>
          <div class="field">
            <label for="setPin">PIN admin baru</label>
            <input id="setPin" type="password" inputmode="numeric" placeholder="Kosongkan jika tidak diubah">
          </div>
          <button class="btn btn-primary" type="submit">Simpan Pengaturan</button>
        </form>
      </section>
    </div>

  </section>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
